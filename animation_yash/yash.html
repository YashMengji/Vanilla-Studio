<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .div-table{
      position: relative;
      margin: 25px;
    }
    .div-list-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
      justify-content: center;
      text-align: center;
      border-radius: 8px;
      width: 200px;
      
    }
    .div-list-grid div{
      background-color: rgb(174, 255, 227);
      border: 1px solid black;
      padding: 5px 10px;
    }
    .div-circle{
      position: absolute;
      left: 0px;
      top: -4px;
      transition: left 0.45s;
    }
    .div-result-text{
      margin: 25px;
    }
  </style>
</head>
<body>
  <!-- <div class="div-list-sort"> -->
    <div class="div-table">
      <div class="div-list-grid"> 

      </div>
      <div class="div-circle">
        <svg height="34" width="34" xmlns="http://www.w3.org/2000/svg">
          <circle r="16" cx="17" cy="17" fill="none" stroke="red" stroke-width="2" />
        </svg>
      </div>
    </div>
    <div class="div-result-text"> </div>
    <!-- </div> -->
    
  </body>
  <script src="yash.js"></script>
  </html>
